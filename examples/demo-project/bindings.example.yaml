# Example local bindings for the demo-project.
# Copy to .pade/bindings.yaml (gitignored) or pass --bindings.
# Do not commit real credentials.
version: "0.1"

capabilities:
  github.user.read:
    provider: env
    env:
      - GITHUB_TOKEN

  # Vault alternative (local -dev only; not production-safe):
  # github.user.read:
  #   provider: vault
  #   vault:
  #     path: secret/pade/github
  #     fields:
  #       token: GITHUB_TOKEN

  # 1Password (see docs/onepassword-dogfood.md / mise run dogfood-onepassword-live):
  # github.user.read:
  #   provider: onepassword
  #   onepassword:
  #     refs:
  #       GITHUB_TOKEN: "op://pade-demo/pade-github/credential"

  # Keeper Commander (see docs/keeper-dogfood.md / mise run dogfood-keeper):
  # github.user.read:
  #   provider: keeper
  #   keeper:
  #     refs:
  #       GITHUB_TOKEN: "keeper://YOUR_RECORD_UID"
