# Local 1Password bindings for the demo-project (Milestone 6 / fake-op CI path).
# For a real GitHub API demo with your PAT, use mise run dogfood-onepassword-live instead.
version: "0.1"

capabilities:
  github.user.read:
    provider: onepassword
    onepassword:
      refs:
        GITHUB_TOKEN: "op://pade-demo/github/credential"
