name: DevPod dogfood

# Separate from the fast unit/CLI CI workflow. This job boots a real DevPod
# workspace with the docker provider and runs PADE inside it.
on:
  push:
    branches: [main]
    paths:
      - "examples/demo-project/**"
      - "scripts/devpod-dogfood.sh"
      - ".github/workflows/devpod-dogfood.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/**"
  pull_request:
    paths:
      - "examples/demo-project/**"
      - "scripts/devpod-dogfood.sh"
      - ".github/workflows/devpod-dogfood.yml"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devpod-dogfood-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVPOD_VERSION: v0.6.15
  DEVPOD_WORKSPACE: demo-project

jobs:
  dogfood:
    name: DevPod + PADE smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          cache: true
          install_args: --locked --include-task-tools

      - name: Install DevPod CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/devpod \
            "https://github.com/loft-sh/devpod/releases/download/${DEVPOD_VERSION}/devpod-linux-amd64"
          sudo install -m 0755 /tmp/devpod /usr/local/bin/devpod
          devpod version

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Run DevPod dogfood
        run: mise run dogfood-devpod-ci

      - name: Cleanup DevPod workspace
        if: always()
        run: mise run dogfood-devpod-delete || true
