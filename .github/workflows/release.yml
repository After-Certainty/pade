name: Release

# Milestone I: explicit, manual releases only. Never runs on merge to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version tag (e.g. v0.1.0 or 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-release checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Normalize and validate version
        id: version
        run: |
          v="${{ inputs.version }}"
          case "$v" in
            v*) ;;
            *) v="v$v" ;;
          esac
          case "$v" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "error: version must look like v0.1.0 or 0.1.0 (got: ${{ inputs.version }})" >&2; exit 1 ;;
          esac
          echo "tag=$v" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Unit checks
        run: make ci-unit

      - name: Smoke checks
        run: make ci-smoke

      - name: Container smoke
        run: make ci-container

  release:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.x'
          cache: true

      - name: Set release metadata
        id: meta
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build CLI release artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          export COMMIT="${{ steps.meta.outputs.commit }}"
          export BUILD_TIME="${{ steps.meta.outputs.build_time }}"
          make release-artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pade-broker image
        id: broker-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5.7.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ksteffe/pade-broker:${{ steps.meta.outputs.version }}
            ghcr.io/ksteffe/pade-broker:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}

      - name: Write image digest artifact
        run: |
          mkdir -p "dist/${{ steps.meta.outputs.version }}"
          echo "${{ steps.broker-image.outputs.digest }}" > "dist/${{ steps.meta.outputs.version }}/pade-broker-image.digest"
          {
            echo "pade-broker ${{ steps.meta.outputs.version }} ${{ steps.broker-image.outputs.digest }}"
            echo "commit ${{ steps.meta.outputs.commit }}"
          } > "dist/${{ steps.meta.outputs.version }}/release-manifest.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2.3.3.0.2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.version }}/*
