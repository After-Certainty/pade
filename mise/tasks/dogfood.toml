# Included task TOML (no [tasks.] prefix). See mise task_config.includes docs.

# --- Deterministic dogfood (CI smoke subset) ---

[dogfood-identity]
description = "Alice/Bob identity separation smoke"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
chmod +x scripts/identity-dogfood.sh
PADE="$PWD/bin/pade" exec ./scripts/identity-dogfood.sh
"""

