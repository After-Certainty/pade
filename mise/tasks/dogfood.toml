# --- Live / manual integration ---

[dogfood-broker-stage-b]
description = "Stage B: real Cursor OIDC + local broker (Cloud Agent; not CI)"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
chmod +x scripts/broker-stage-b-dogfood.sh
PADE="$PWD/bin/pade" BROKER="$PWD/bin/pade-broker" exec ./scripts/broker-stage-b-dogfood.sh
"""

[dogfood-broker-stage-b-exec]
description = "Stage B exec: real OIDC + github.repo.read + google-analytics.read"
depends = ["build"]
run = """
#!/usr/bin/env bash
set -euo pipefail
chmod +x scripts/broker-stage-b-exec-dogfood.sh \
  examples/demo-project/scripts/github-repo-meta \
  examples/demo-project/scripts/ga-property-meta
go build -o bin/pade-provider-github ./examples/providers/github
go build -o bin/pade-provider-google-analytics ./examples/providers/google-analytics
PADE="$PWD/bin/pade" BROKER="$PWD/bin/pade-broker" exec ./scripts/broker-stage-b-exec-dogfood.sh
"""

