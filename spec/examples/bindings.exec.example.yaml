# Example broker-side bindings for provider: exec (draft external provider contract).
# Consumer/development bindings must NOT use provider: exec — use provider: broker instead.
# See docs/provider-contract.md. Command paths are host-local — not portable Intent.
version: "0.1"

capabilities:
  demo.derived:
    provider: exec
    exec:
      command: ["./bin/pade-provider-stub"]
      config:
        tokenEnv: DEMO_TOKEN
        value: example-only-not-a-real-secret

  # GitHub App reference provider (examples/providers/github) — broker host only.
  # Fake CI: PADE_PROVIDER_FAKE=1. Real: set appId/installationId/privateKeyPath
  # or GITHUB_APP_* env on the broker host — never put the private key in Intent.
  # github.repo.read:
  #   provider: exec
  #   exec:
  #     command: ["./bin/pade-provider-github"]
  #     config:
  #       tokenEnv: GITHUB_TOKEN
  #       appId: "123456"
  #       installationId: "789012"
  #       privateKeyPath: "/run/secrets/github-app.pem"
  #       repositories: [After-Certainty/pade]
  #       permissions:
  #         metadata: read
  #         contents: read
  #
  # Google Analytics reference provider (examples/providers/google-analytics).
  # Fake CI: PADE_PROVIDER_FAKE=1. Real: service account JSON on broker host.
  # google-analytics.read:
  #   provider: exec
  #   exec:
  #     command: ["./bin/pade-provider-google-analytics"]
  #     config:
  #       tokenEnv: GA_ACCESS_TOKEN
  #       propertyId: properties/123456789
  #       serviceAccountFile: /run/secrets/ga-sa.json
  #       scope: https://www.googleapis.com/auth/analytics.readonly
