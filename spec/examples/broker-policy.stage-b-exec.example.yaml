# Example Stage B exec broker policy for a Cursor Cloud Agent local proof.
# Server-owned — not portable pade.yaml.
#
# Used by mise run dogfood-broker-stage-b-exec (real OIDC + exec providers).
# Replace subject with your attested Cursor workload subject:
#   pade identity --audience <BROKER_AUDIENCE>
#
# requireRepoURLs: false until Cursor attests complete repo_urls.
version: "0.1"

oidc:
  issuer: https://api.cursor.com
  audience: https://pade-broker.local
  # jwksURL defaults to https://api.cursor.com/keys when omitted

policies:
  - subject: "user:YOUR_CURSOR_USER_ID"
    requireRepoURLs: false
    capabilities:
      - github.repo.read
      - google-analytics.read
